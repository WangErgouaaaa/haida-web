# One Pages artifact keeps the current site at root, pins the pre-PR snapshot

# at /before/, and publishes the reviewed PR snapshot at /after/.

name: Deploy before and after comparison



on:

  workflow_dispatch:
  


permissions: {}



concurrency:

  group: pages
  
  cancel-in-progress: false
  


jobs:

  build:
  
    name: Build pinned comparison
    
    runs-on: ubuntu-latest
    
    timeout-minutes: 20
    
    permissions:
    
      contents: read
      
    steps:
    
      - name: Checkout pre-PR snapshot
      
        uses: actions/checkout@v4
        
        with:
        
          repository: WangErgouaaaa/haida-web
          
          ref: 019bcb0e2e2bb4311863e2bfb9e34ac51029c61d
          
          path: before-src
          


      - name: Checkout reviewed PR snapshot
      
        uses: actions/checkout@v4
        
        with:
        
          repository: ZhouZhu3/haida-web
          
          ref: 94f1d50113fd220526c71163ed0a758d1f6c3825
          
          path: after-src
          


      - name: Set up Node.js
      
        uses: actions/setup-node@v4
        
        with:
        
          node-version: 22
          
          cache: npm
          
          cache-dependency-path: after-src/package-lock.json
          


      - name: Build and verify reviewed PR snapshot
      
        working-directory: after-src
        
        env:
        
          NUXT_APP_BASE_URL: /haida-web/after/
          
        run: |
        
          npm ci
          
          npm run db:seed
          
          npm run typecheck
          
          npm test
          
          npm run generate
          
          node scripts/assert-dist.mjs
          


      - name: Assemble comparison site
      
        run: |
        
          mkdir -p comparison-site/before comparison-site/after
          
          cp -R before-src/assets before-src/*.html comparison-site/
          
          cp before-src/.nojekyll comparison-site/.nojekyll
          
          cp -R before-src/assets before-src/*.html comparison-site/before/
          
          cp -R after-src/.output/public/. comparison-site/after/
          
          test -f comparison-site/index.html
          
          test -f comparison-site/before/index.html
          
          test -f comparison-site/after/index.html
          
          test -f comparison-site/.nojekyll
          
          grep -Fq './assets/slhs-emblem.png' comparison-site/before/index.html
          
          grep -Fq '/haida-web/after/_nuxt/' comparison-site/after/index.html
          


      - name: Upload comparison Pages artifact
      
        uses: actions/upload-pages-artifact@v3
        
        with:
        
          path: comparison-site
          


  deploy:
  
    name: Deploy comparison site
    
    needs: build
    
    runs-on: ubuntu-latest
    
    timeout-minutes: 10
    
    permissions:
    
      pages: write
      
      id-token: write
      
    environment:
    
      name: github-pages
      
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
    
      - name: Configure GitHub Pages
      
        uses: actions/configure-pages@v5
        


      - name: Deploy to GitHub Pages
      
        id: deployment
        
        uses: actions/deploy-pages@v4
        









































































