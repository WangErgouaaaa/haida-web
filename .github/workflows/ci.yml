name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Typecheck · Test · Generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Nuxt 需要 22.19+,也满足 pdfjs-dist 的要求
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Seed fresh database
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

      - name: Generate static site (fresh DB content)
        run: npm run generate
        env:
          NUXT_APP_BASE_URL: /haida-web/

      - name: Assert static artifacts (routes, non-empty payloads, preview images)
        run: node scripts/assert-dist.mjs

      - name: Upload static build artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: .output/public
          retention-days: 7
