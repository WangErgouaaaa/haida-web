name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署权限:只读代码 + 写 Pages artifact + OIDC token
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个 Pages 部署,新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Seed → Generate → Assert → Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # node:sqlite 需要 22.5+
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Seed fresh database (CI 从零生成,杜绝空库产物)
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

      - name: Generate static site
        run: npm run generate
        env:
          NUXT_APP_BASE_URL: /haida-web/

      - name: Assert static artifacts
        run: node scripts/assert-dist.mjs

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
